name: Build DisguiseAPI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B install -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: DisguiseAPI
          path: Plugin/target/DisguiseAPI.jar
